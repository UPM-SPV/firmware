name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write
  actions: read



jobs:

  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release_please.outputs.release_created }}
      tag_name: ${{ steps.release_please.outputs.tag_name }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Release please
        id: release_please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: master


  build-release:
    if: ${{ needs.release-please.outputs.release_created }}
    needs:
      - release-please

    uses: ./.github/workflows/build_call.yml
    secrets: inherit
    with:
      use_prodkeys: true


  publish-release:
    runs-on: ubuntu-latest
    needs:
      - release-please
      - build-release

    steps:
      - name: Fetch build
        uses: actions/download-artifact@v8
        with:
          name: dfu_application.zip
          skip-decompress: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload --repo="${{ github.repository }}" "${{ needs.release-please.outputs.tag_name }}" ${{ github.workspace }}/dfu_application.zip

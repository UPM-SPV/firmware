name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review



jobs:
  build:
    if: ${{ github.event.pull_request.user.type != 'Bot' }}
    uses: ./.github/workflows/build_call.yml
    secrets: inherit
    with:
      use_prodkeys: false
